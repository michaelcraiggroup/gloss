name: Gloss
options:
  bundleIdPrefix: group.michaelcraig
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

packages:
  GlossPackage:
    path: .
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: JTL9F365FN

targets:
  Gloss:
    type: application
    platform: macOS
    sources:
      - path: Sources/Gloss
      # xcodegen has no target-level `resources:` key — the extensionless CLI
      # script needs an explicit buildPhase to land in Contents/Resources (#67).
      - path: Sources/Gloss/Resources/gloss
        buildPhase: resources
    info:
      path: Scripts/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleDisplayName: Gloss
        CFBundleShortVersionString: "1.24.0"
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - net.daringfireball.markdown
            CFBundleTypeExtensions:
              - md
              - markdown
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.folder
        # ONE-WAY LATCH: these values only take effect with a CFBundleVersion
        # bump, and un-publishing a public container is unreliable — treat as
        # permanent. Publishes the container as the "Gloss" folder in
        # iCloud Drive (Finder + Files). See docs/ICLOUD_SETUP.md.
        NSUbiquitousContainers:
          iCloud.group.michaelcraig.gloss:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Gloss
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Gloss.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.print: true
        # iCloud Documents (vault sync). These are RESTRICTED entitlements:
        # Developer ID archives must now embed the "Gloss Developer ID iCloud"
        # profile — see the Release config below + docs/ICLOUD_SETUP.md.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.group.michaelcraig.gloss
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.group.michaelcraig.gloss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: group.michaelcraig.gloss
        PRODUCT_NAME: Gloss
        MARKETING_VERSION: "1.24.0"
        CURRENT_PROJECT_VERSION: "12"
        ENABLE_HARDENED_RUNTIME: "YES"   # required for Developer ID notarization
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: XCODE_BUILD
        INFOPLIST_KEY_CFBundleDisplayName: Gloss
      configs:
        # iCloud is a restricted entitlement: Developer ID archives must embed
        # a provisioning profile. Debug stays Automatic (base) so ⌘R keeps
        # working via Xcode-managed profiles. release-dmg.sh no longer passes
        # signing on the CLI — CLI settings would hit every target, and the
        # QL appex can't use the app's profile.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: Gloss Developer ID iCloud
    dependencies:
      - package: GlossPackage
        product: GlossKit
      - package: GRDB
        product: GRDB
      - target: GlossQL
        embed: true
    scheme:
      testTargets:
        - GlossTests

  GlossQL:
    type: app-extension
    platform: macOS
    sources:
      - path: GlossQLExtension
    info:
      path: GlossQLExtension/Info.plist
      properties:
        CFBundleShortVersionString: "1.24.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewViewController"
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportedContentTypes:
              - net.daringfireball.markdown
            QLSupportsSearchableItems: true
    entitlements:
      path: GlossQL.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: group.michaelcraig.gloss.quicklook
        PRODUCT_NAME: GlossQL
        MARKETING_VERSION: "1.24.0"
        CURRENT_PROJECT_VERSION: "12"
        ENABLE_HARDENED_RUNTIME: "YES"   # required for Developer ID notarization
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
      configs:
        # No restricted entitlements here → explicitly profile-free, still
        # manual Developer ID so the whole archive signs in one pass.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - package: GlossPackage
        product: GlossKit
      - framework: Quartz.framework
        implicit: true

  GlossTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GlossTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: group.michaelcraig.gloss.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gloss.app/Contents/MacOS/Gloss"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Gloss
      - package: GlossPackage
        product: GlossKit

  # iOS companion (universal purchase: SAME bundle id as the Mac app — the
  # iOS platform is added to the existing App Store Connect record, never a
  # new one). Compiles the shared Sources/Gloss layer with an EXCLUDE list:
  # new files are iOS-compiled by default, so AppKit drift breaks this build
  # gate instead of silently accumulating. XCODE_BUILD is CRITICAL here —
  # without it StoreManager compiles its SPM dev bypass and Pro is free.
  GlossiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Gloss
        excludes:
          - GlossApp.swift
          - Services/EditorLauncher.swift
          - Services/FolderWatcher.swift
          - Services/QuickCaptureController.swift
          - Services/SecurityScopedBookmarks.swift
          - Services/TemplateFillService.swift
          - Views/ContentView.swift
          - Views/DocumentView.swift
          - Views/GraphView.swift
          - Views/SettingsView.swift
          - Views/SidebarView.swift
          - Views/Components/EditorWebView.swift
          - Views/Components/WebView.swift
          # Walkthrough spotlight chrome — guides are macOS-only in v1 (the
          # Rabble SDK isn't bundled on iOS) and this view uses onExitCommand.
          - Views/Components/NativeSpotlightOverlay.swift
          # Hot-corner capture panel content (mounted only by the excluded
          # QuickCaptureController); iOS capture is a Share Extension arc.
          - Views/Components/QuickCaptureView.swift
          - Resources/**
      - path: GlossiOS
    info:
      path: GlossiOS/Info.plist
      properties:
        CFBundleDisplayName: Gloss
        CFBundleShortVersionString: "1.24.0"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Gloss uses the camera to scan the pairing code shown by Gloss on your Mac."
        CFBundleURLTypes:
          - CFBundleURLName: group.michaelcraig.gloss.pair
            CFBundleURLSchemes:
              - gloss
        # Must agree with the Mac app's declaration (values are a one-way
        # latch — see the Gloss target + docs/ICLOUD_SETUP.md).
        NSUbiquitousContainers:
          iCloud.group.michaelcraig.gloss:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Gloss
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: GlossiOS.entitlements
      properties:
        # Same container as the Mac app — vault sync. Unsigned simulator
        # builds carry no entitlements, so container resolution returns nil
        # there and the app degrades to sandbox-local vaults.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.group.michaelcraig.gloss
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.group.michaelcraig.gloss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: group.michaelcraig.gloss
        PRODUCT_NAME: Gloss
        MARKETING_VERSION: "1.24.0"
        CURRENT_PROJECT_VERSION: "12"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: XCODE_BUILD
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Gloss
      configs:
        # Setting the key in base REPLACES Xcode's per-config defaults, which
        # silently dropped DEBUG from Debug builds (#if DEBUG never true).
        # Restore it for Debug; Release keeps XCODE_BUILD only.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG XCODE_BUILD
    dependencies:
      - package: GlossPackage
        product: GlossKit
      - package: GRDB
        product: GRDB

schemes:
  Gloss:
    build:
      targets:
        Gloss: all
        GlossQL: all
        GlossTests: [test]
    run:
      config: Debug
      storeKitConfiguration: GlossStore.storekit
    test:
      config: Debug
      targets:
        - GlossTests
    profile:
      config: Release
    archive:
      config: Release

  GlossiOS:
    build:
      targets:
        GlossiOS: all
    run:
      config: Debug
      storeKitConfiguration: GlossStore.storekit
    archive:
      config: Release
